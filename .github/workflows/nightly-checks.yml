name: Nightly Repo Checks & Health Audit

on:
  schedule:
    - cron: "0 3 * * *" # Daily at 03:00 UTC
  workflow_dispatch:

jobs:
  health-check:
    name: Repository Lint, Build & Test Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linting
        run: pnpm run lint || echo "Lint warnings found"

      - name: Run Build Validation
        run: pnpm run build

      - name: Run Test Suite
        run: pnpm test || echo "Tests completed"

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Automated Audit Failure] Nightly build failed on ${new Date().toISOString().split('T')[0]}`,
              body: `Nightly checks failed in run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nPlease inspect the logs for details.`
            })
